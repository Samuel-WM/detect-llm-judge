# Phase 0c: identifiability map. Addendum per PHASE_0C_SPEC.md. CPU only, target < 30 min.
seed: 0

d: 16
M: 5
beta: 1.0

psi_grid_deg: [90, 45, 20, 10, 5, 2]
sigma_grid: [0.0, 0.25, 0.5, 1.0, 2.0]
lambda_grid: [1, 4, 16]
N_grid: [50, 100, 300, 600, 1200]
pool_multiplier: 10   # candidate pool size = pool_multiplier * N

replicates: 200

primary_map:
  lambda_aniso: 4
  N: 600
  select: random

marginal_a:
  psi_deg: 20
  sigma: 0.5
  lambda_aniso: 4

marginal_b:
  psi_deg: 20
  sigma: 0.5
  N: 600

marginal_c:
  psi_deg: 20
  lambda_aniso: 4
  N: 600
  fixed_sigma: 0.5

representative_cell:   # used for negative controls + Section 4.6 stat-battery exercise
  psi_deg: 20
  sigma: 0.5
  lambda_aniso: 4
  N: 600
  select: random

mixture_identifiability:
  alphas: [[0.5, 0.5], [0.8, 0.2]]
  psi_deg_grid: [45, 20]
  sigma: 0.5
  lambda_aniso: 4
  N: 600

output:
  results_path: results/phase0c_synthetic.parquet
  run_id_prefix: phase0c
